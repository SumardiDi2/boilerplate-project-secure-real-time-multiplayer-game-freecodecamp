<!DOCTYPE html>
<html>
  <head>
    <title>Secure Real-Time Multiplayer Game</title>
    <meta
      name="description"
      content="An example for the fCC InfoSec Secure Real-Time Multiplayer Game project"
    />
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/public/style.css" type="text/css" />
    <link href="https://fonts.googleapis.com/css?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
  </head>
  <body>
    <header>
      <h1>Secure Real Time Multiplayer Game</h1>
    </header>
    <hr style="margin: 25px" />
    <div class="container">
      <div class="game-column">
        <canvas
          ref="game"
          id="game-window"
          width="640"
          height="480"
        >
        </canvas>
        <p class="hint">Move with WASD or the arrow keys and collect the glowing gems.</p>
      </div>
      <aside class="scoreboard">
        <h2>Scoreboard</h2>
        <p id="score">Score: 0</p>
        <p id="rank">Rank: 1/1</p>
        <p id="players-count">Players: 0</p>
      </aside>
    </div>
    <script src="/public/game.mjs" type="module"></script>
  </body>
</html>
